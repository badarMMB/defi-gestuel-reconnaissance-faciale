# CompreFace 1.2.0 pour le prototype du défi gestuel, d'après le docker-compose officiel d'Exadel.
# Seule l'interface (qui relaie aussi l'API REST) est publiée, sur http://localhost:8000, et uniquement sur la
# machine elle-même (127.0.0.1) : la base et le moteur ne sont pas joignables du réseau.
# Aucun redémarrage automatique : on lance et on arrête CompreFace à la main (docker compose up -d / down).
name: defi-gestuel-compreface

volumes:
  postgres-data:

services:
  compreface-postgres-db:
    image: ${registry}compreface-postgres-db:${POSTGRES_VERSION}
    restart: "no"
    container_name: "defi-compreface-postgres-db"
    environment:
      - POSTGRES_USER=${postgres_username}
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_DB=${postgres_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  compreface-admin:
    image: ${registry}compreface-admin:${ADMIN_VERSION}
    restart: "no"
    container_name: "defi-compreface-admin"
    environment:
      - POSTGRES_USER=${postgres_username}
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/${postgres_db}
      - SPRING_PROFILES_ACTIVE=dev
      - ENABLE_EMAIL_SERVER=false
      - ADMIN_JAVA_OPTS=${compreface_admin_java_options}
      - MAX_FILE_SIZE=${max_file_size}
      - MAX_REQUEST_SIZE=${max_request_size}B
    depends_on:
      - compreface-postgres-db
      - compreface-api

  compreface-api:
    image: ${registry}compreface-api:${API_VERSION}
    restart: "no"
    container_name: "defi-compreface-api"
    depends_on:
      - compreface-postgres-db
    environment:
      - POSTGRES_USER=${postgres_username}
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/${postgres_db}
      - SPRING_PROFILES_ACTIVE=dev
      - API_JAVA_OPTS=${compreface_api_java_options}
      # false : CompreFace ne garde que les empreintes des visages, pas les photos envoyées pour les enregistrer.
      - SAVE_IMAGES_TO_DB=${save_images_to_db}
      - MAX_FILE_SIZE=${max_file_size}
      - MAX_REQUEST_SIZE=${max_request_size}B
      - CONNECTION_TIMEOUT=${connection_timeout}
      - READ_TIMEOUT=${read_timeout}

  compreface-fe:
    image: ${registry}compreface-fe:${FE_VERSION}
    restart: "no"
    container_name: "defi-compreface-ui"
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - compreface-api
      - compreface-admin
    environment:
      - CLIENT_MAX_BODY_SIZE=${max_request_size}
      - PROXY_READ_TIMEOUT=${read_timeout}ms
      - PROXY_CONNECT_TIMEOUT=${connection_timeout}ms

  compreface-core:
    image: ${registry}compreface-core:${CORE_VERSION}
    restart: "no"
    container_name: "defi-compreface-core"
    environment:
      - ML_PORT=3000
      - IMG_LENGTH_LIMIT=${max_detect_size}
      - UWSGI_PROCESSES=${uwsgi_processes}
      - UWSGI_THREADS=${uwsgi_threads}
    healthcheck:
      test: curl --fail http://localhost:3000/healthcheck || exit 1
      interval: 10s
      retries: 3
      start_period: 60s
      timeout: 2s
